<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cal Poly SLO — Campus Model</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #eef; }
    canvas { display: block; }
    #hud { position: fixed; left: 12px; top: 12px; padding: 10px 12px; background: rgba(10,14,20,.62); backdrop-filter: blur(6px); border-radius: 10px; font-size: 12px; line-height: 1.5; max-width: 300px; pointer-events: none; }
    #hud b { color: #ffd54a; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0e12; color: #cdd; font-size: 14px; z-index: 10; transition: opacity .6s; }
    #loading.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">Building campus…</div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
